services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      AccessControl__OwnerUserId: ${ACCESSCONTROL__OWNERUSERID}
      Cors__AllowedOrigins__0: http://localhost:5173
      Supabase__Url: ${SUPABASE__URL}
      Supabase__Storage__ServiceRoleKey: ${SUPABASE__STORAGE__SERVICEROLEKEY}
      GoogleCalendar__Enabled: ${GOOGLECALENDAR__ENABLED:-false}
      GoogleCalendar__ClientId: ${GOOGLECALENDAR__CLIENTID:-}
      GoogleCalendar__ClientSecret: ${GOOGLECALENDAR__CLIENTSECRET:-}
      GoogleCalendar__RedirectUri: ${GOOGLECALENDAR__REDIRECTURI:-http://localhost:5080/api/v1/integrations/google-calendar/callback}
      GoogleCalendar__FrontendRedirectUri: ${GOOGLECALENDAR__FRONTENDREDIRECTURI:-http://localhost:5173/settings?section=calendar}
      GoogleCalendar__FrontendBaseUri: ${GOOGLECALENDAR__FRONTENDBASEURI:-http://localhost:5173/}
      GoogleCalendar__CalendarId: ${GOOGLECALENDAR__CALENDARID:-primary}
      GoogleCalendar__TimeZone: ${GOOGLECALENDAR__TIMEZONE:-Asia/Singapore}
      GoogleCalendar__EventDurationMinutes: ${GOOGLECALENDAR__EVENTDURATIONMINUTES:-60}
    ports:
      - "5080:5080"
    volumes:
      - ./:/workspace
      - dotnet_packages:/root/.nuget/packages
      - data_protection_keys:/root/.aspnet/DataProtection-Keys

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5080/api/v1}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_SUPABASE_USERNAME_DOMAIN: ${VITE_SUPABASE_USERNAME_DOMAIN:-users.adiel.local}
    ports:
      - "5173:5173"
    volumes:
      - ./src/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  dotnet_packages:
  data_protection_keys:
  web_node_modules:
